default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

# These defaults match the local-only PostgreSQL service in compose.yaml.
# DATABASE_URL overrides the connection settings for the current environment.
development: &local
  <<: *default
  host: <%= ENV.fetch("PGHOST", "127.0.0.1") %>
  port: <%= ENV.fetch("PGPORT", 5432) %>
  username: <%= ENV.fetch("PGUSER", "codecoach") %>
  password: <%= ENV.fetch("PGPASSWORD", "codecoach") %>
  database: codecoach_development

# Never point DATABASE_URL at development or production when running tests.
test:
  <<: *local
  database: codecoach_test

# Supply the managed PostgreSQL connection string through DATABASE_URL.
production:
  <<: *default
  database: codecoach_production
